<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>GPUAtHome — Exclusion Analytics</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0e1a;
    color: #e8ecf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 480px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: #ffffff;
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    color: #a9b4c7;
    margin-bottom: 24px;
  }
  .status {
    font-weight: 600;
  }
  .status.on { color: #4ee6b0; }
  .status.off { color: #f0b95c; }
  button {
    background: #22d3ee;
    color: #05131f;
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Exclusion Analytics — GPUAtHome</h1>
    <p>
      Cette page permet d'exclure tes propres visites du suivi Plausible sur
      gpuathome.com, quel que soit le réseau utilisé (wifi, 4G, 5G).<br><br>
      Statut actuel : <span id="status" class="status"></span>
    </p>
    <button id="toggleBtn"></button>
  </div>

  <script>
    function isExcluded() {
      return localStorage.plausible_ignore === 'true';
    }

    function render() {
      const excluded = isExcluded();
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('toggleBtn');
      if (excluded) {
        statusEl.textContent = 'tu es actuellement EXCLU du suivi';
        statusEl.className = 'status on';
        btn.textContent = 'Réactiver le suivi';
      } else {
        statusEl.textContent = 'tu es actuellement SUIVI (non exclu)';
        statusEl.className = 'status off';
        btn.textContent = 'Exclure mes visites';
      }
    }

    document.getElementById('toggleBtn').addEventListener('click', function () {
      localStorage.plausible_ignore = isExcluded() ? 'false' : 'true';
      render();
    });

    render();
  </script>
</body>
</html>
